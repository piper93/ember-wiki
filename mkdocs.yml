site_name: Ember Wiki
site_description: Player-facing encyclopedia for the Ember campaign

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: deep orange
    accent: amber
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

  plugins:
    - search
  
  nav:
    - Home: index.md
    - World & Lore: world/index.md
    - Locations: locations/index.md
    - Characters: characters/index.md
    - Factions: factions/index.md
    - Campaign Journal: campaign/index.md
    - Reference: reference.md
    - Statistics: stats/index.md
